# espgpu 推荐设置 —— 合并进 dsda-doom.cfg / prboom-plus.cfg（同名键覆盖即可）
#
# 键名沿用 prboom-plus 的 GL 渲染器设置；不同版本可能有增减，以你的版本写出的 cfg 为准。
# 原则：只用 GL 1.2 能表达的路径，关掉需要扩展/着色器/模板的效果，分辨率与设备一致。

# 视频模式：OpenGL，窗口 640x400（设备 320x200 的整数倍，blit 时不糊）
videomode                 "OpenGL"
screen_resolution         "640x400"
use_fullscreen            0
render_vsync              0
uncapped_framerate        0

# 不走扩展：我们没有 VBO / FBO / PBO / 着色器 / 压缩纹理 / 各向异性
gl_compatibility          1
gl_arb_multitexture       1
gl_arb_texture_compression 0
gl_arb_texture_non_power_of_two 1
gl_ext_arb_vertex_buffer_object 0
gl_arb_pixel_buffer_object 0
gl_arb_shader_objects     0
gl_ext_blend_color        0
gl_ext_framebuffer_object 0
gl_ext_packed_depth_stencil 0
gl_ext_texture_filter_anisotropic 0
gl_use_stencil            0

# 设备是 16 位深度、RGB565
gl_colorbuffer_bits       16
gl_depthbuffer_bits       16

# 光照：glboom 模式（纯固定管线），不要 shader 光照
gl_lightmode              0
gl_light_ambient          20
gl_fog                    1

# 纹理：设备最大 512，最近邻最省（双线性也支持，但每像素多 3 次取样）
gl_texture_filter         0
gl_sprite_filter          0
gl_patch_filter           0
gl_texture_filter_anisotropic 0
gl_tex_format_string      "GL_RGBA"
gl_use_paletted_texture   1
gl_use_shared_texture_palette 0

# 显示列表在 espgpu 上会被缓存成设备端缓冲（R6），可以打开
gl_use_display_lists      1
gl_finish                 0
gl_clear                  0

# 天空：标准模式；镜像 / 模板相关效果不可用
gl_skymode                0
gl_drawskys               1
gl_boom_colormaps         1
gl_hires_textures         0
